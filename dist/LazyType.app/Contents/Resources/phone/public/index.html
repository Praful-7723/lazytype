<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f8fafc">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>LazyType Remote</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- Ambient Fluid Mesh Background Blobs -->
  <div class="ambient-mesh">
    <div class="mesh-blob blob-1"></div>
    <div class="mesh-blob blob-2"></div>
    <div class="mesh-blob blob-3"></div>
  </div>

  <div id="app" class="app-root">

    <!-- Screen 1: Instant Pairing / Connecting State -->
    <section id="screen-pairing" class="screen active">
      <div class="pairing-container">
        <!-- Canvas Logo -->
        <div class="brand-hero">
          <canvas id="canvas-logo" width="160" height="160" class="canvas-brand-logo"></canvas>
          <h1 class="brand-title">LazyType</h1>
          <p class="brand-subtitle">Mac Meeting Chat Companion</p>
        </div>

        <div class="glass-card pairing-card">
          <!-- Automatic Connecting HUD -->
          <div id="connecting-state" class="connecting-hud">
            <div class="liquid-pulse-ring">
              <div class="liquid-ring ring-1"></div>
              <div class="liquid-ring ring-2"></div>
              <div class="liquid-center-icon">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                  <line x1="8" y1="21" x2="16" y2="21"></line>
                  <line x1="12" y1="17" x2="12" y2="21"></line>
                </svg>
              </div>
            </div>
            <h2 id="connect-title" class="connect-title">Connecting to Mac...</h2>
            <p id="connect-status" class="card-desc">Establishing secure companion session</p>
            <div class="progress-bar-container">
              <div class="progress-bar-fill"></div>
            </div>
          </div>

          <!-- Fallback Manual Settings (Hidden by default, auto-discovers) -->
          <div class="manual-settings-wrapper">
            <button id="btn-toggle-manual" class="btn-text-glass" type="button">
              ⚙️ Manual Connection Details
            </button>
            <div id="manual-settings-form" class="manual-settings-form hidden">
              <div class="glass-input-group">
                <label for="input-host">Mac IP / Host</label>
                <input type="text" id="input-host" placeholder="192.168.31.20" inputmode="url" autocorrect="off" autocapitalize="none">
              </div>

              <div class="glass-input-row">
                <div class="glass-input-group flex-1">
                  <label for="input-port">Port</label>
                  <input type="number" id="input-port" value="9123" placeholder="9123">
                </div>
                <div class="glass-input-group flex-2">
                  <label for="input-token">Pairing Token</label>
                  <input type="text" id="input-token" placeholder="Auto" autocorrect="off" autocapitalize="none">
                </div>
              </div>

              <button id="btn-manual-connect" class="btn-primary-glass btn-large">
                Connect Now
              </button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Screen 2: Ultra-Clean One-Handed Controller (Message + SEND) -->
    <section id="screen-controller" class="screen hidden">
      <!-- Liquid Glass Top Header Pill -->
      <header class="glass-header">
        <div class="status-pill-glass">
          <span class="status-dot connected" id="status-dot"></span>
          <span class="device-name" id="mac-name">MacBook Air</span>
          <span class="status-sub" id="connection-state">• Ready ✓</span>
        </div>

        <button id="btn-disconnect" class="btn-icon-glass" title="Connection Settings" aria-label="Settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </header>

      <!-- Liquid Glass Hero Message Card -->
      <main class="hero-controller-stage">
        <!-- Quick Canned Replies Scroll Strip -->
        <div class="quick-replies-glass-strip">
          <div class="quick-replies-scroll">
            <button class="liquid-chip" data-text="Can you send me that document?">📄 Send document</button>
            <button class="liquid-chip" data-text="Can you hear me?">🔊 Can you hear me?</button>
            <button class="liquid-chip" data-text="Give me 2 minutes, BRB">⏱️ BRB (2 mins)</button>
            <button class="liquid-chip" data-text="I agree, +1">👍 Agreed / +1</button>
            <button class="liquid-chip" data-text="Thanks everyone!">🙏 Thanks!</button>
            <button class="liquid-chip" data-text="I'm on mute, speaking now">🎙️ Speaking now</button>
            <button class="liquid-chip" data-text="Please check your screen share">🖥️ Check screen</button>
          </div>
        </div>

        <!-- Glass Message Box -->
        <div class="glass-card message-stage-card">
          <div class="textarea-glass-wrapper">
            <textarea
              id="message-input"
              class="message-textarea-glass"
              placeholder="Type message for meeting..."
              enterkeyhint="send"
              autocapitalize="sentences"
              rows="4"
            ></textarea>

            <!-- Floating In-Text Controls -->
            <div class="floating-input-actions">
              <button id="btn-voice-dictate" class="action-btn-glass voice-btn" title="Dictate with voice" aria-label="Voice input">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path>
                  <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                  <line x1="12" y1="19" x2="12" y2="23"></line>
                  <line x1="8" y1="23" x2="16" y2="23"></line>
                </svg>
              </button>
              <button id="btn-clear-text" class="action-btn-glass clear-btn hidden" title="Clear text" aria-label="Clear">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="18" y1="6" x2="6" y2="18"></line>
                  <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
              </button>
            </div>
          </div>

          <!-- Ultra-Premium Hero SEND Button -->
          <button id="btn-send-message" class="btn-hero-send">
            <span class="send-glow-overlay"></span>
            <span class="send-label">SEND MESSAGE</span>
            <span class="send-icon-wrap">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
              </svg>
            </span>
          </button>
        </div>

        <!-- Optional Collapsible Auxiliary Controls -->
        <div class="aux-drawer-wrap">
          <button id="btn-toggle-aux" class="btn-drawer-pill" type="button">
            <span>Meeting Tools & Keys</span>
            <svg class="chevron-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>

          <div id="aux-controls-drawer" class="aux-controls-drawer hidden">
            <div class="quick-tools-grid">
              <button id="btn-mute" class="tool-tile-glass" title="Toggle audio mute">
                <span class="tile-icon">🎙️</span>
                <span class="tile-label" id="quick-mute-label">Mute</span>
              </button>

              <button id="btn-camera" class="tool-tile-glass" title="Toggle camera">
                <span class="tile-icon">📹</span>
                <span class="tile-label" id="quick-cam-label">Camera</span>
              </button>

              <button id="btn-open-chat" class="tool-tile-glass" title="Open meeting chat panel">
                <span class="tile-icon">💬</span>
                <span class="tile-label">Open Chat</span>
              </button>

              <button id="btn-paste" class="tool-tile-glass" title="Paste clipboard text to Mac">
                <span class="tile-icon">📋</span>
                <span class="tile-label">Paste</span>
              </button>
            </div>

            <div class="keypad-glass-row">
              <button class="key-pill-glass" data-key="Enter">↵ Enter</button>
              <button class="key-pill-glass" data-key="Backspace">⌫ Back</button>
              <button class="key-pill-glass" data-key="Tab">Tab</button>
              <button class="key-pill-glass" data-key="Escape">Esc</button>
            </div>
          </div>
        </div>

        <!-- Recent Sent History -->
        <div class="history-glass-card">
          <div class="history-head">
            <span class="history-title-label">Recent Messages</span>
            <button id="btn-clear-history" class="btn-text-tiny">Clear</button>
          </div>
          <div id="history-list" class="history-chips-list">
            <div class="history-empty">No recent messages</div>
          </div>
        </div>
      </main>
    </section>

    <!-- Floating Specular Toast -->
    <div id="toast" class="toast-glass hidden">
      <span class="toast-bullet">•</span>
      <span id="toast-message">Message sent ✓</span>
    </div>

  </div>

  <script src="/app.js"></script>
</body>
</html>
